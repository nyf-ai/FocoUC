<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FocoUC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Concepto: app móvil de una columna con navegación inferior y hojas para las alertas. Paleta tomada del logo: lavanda, violeta profundo, azul noche y crema. */
:root{
  --bg:#F6F2FD; --surface:#FFFFFF; --surface2:#ECE5F8; --ink:#25234F; --muted:#625A85; --line:#DACFEF;
  --accent:#6B40C8; --accent-ink:#FFFFFF; --accent-soft:#E7DCFA;
  --warm:#6B40C8; --warm-soft:#E6D9FB; --shield:#2A2560; --shield-ink:#F3EEFC;
  --soil:#D5C8EC; --trunk:#6E5B8F; --leaf0:#7145CE; --leaf1:#B38CF0; --leaf2:#5A5FD6;
  --scrim:rgba(37,35,79,.55);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15112D; --surface:#1E1A42; --surface2:#2A2459; --ink:#EEE9FB; --muted:#A99FCF; --line:#372F6B;
  --accent:#B796F5; --accent-ink:#1A1238; --accent-soft:#322862;
  --warm:#C8AAF8; --warm-soft:#2D2459; --shield:#0F0B28; --shield-ink:#EEE9FB;
  --soil:#322A60; --trunk:#9C86C4; --leaf0:#9A74EA; --leaf1:#C5A6F6; --leaf2:#7E84EE; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15112D; --surface:#1E1A42; --surface2:#2A2459; --ink:#EEE9FB; --muted:#A99FCF; --line:#372F6B;
  --accent:#B796F5; --accent-ink:#1A1238; --accent-soft:#322862;
  --warm:#C8AAF8; --warm-soft:#2D2459; --shield:#0F0B28; --shield-ink:#EEE9FB;
  --soil:#322A60; --trunk:#9C86C4; --leaf0:#9A74EA; --leaf1:#C5A6F6; --leaf2:#7E84EE; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ic{width:22px;height:22px;flex:none}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface2)}

/* superficies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.soft{background:var(--surface2);border-color:transparent}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-title{font-size:26px;line-height:1.15}
.sub{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* botones */
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink);text-align:center}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:60px;font-size:18px;width:100%;border-radius:18px}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.link{background:none;min-height:44px;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warm{background:var(--warm-soft);color:var(--warm)}

/* formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:400;font-size:15px}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:6px 0}
.toggle input{width:26px;height:26px;accent-color:var(--accent);flex:none;margin-top:2px}

/* si-entonces */
.ifthen{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:4px 12px 12px 4px;padding:10px 12px;font-size:14px}
.ifthen b{color:var(--accent)}

/* temporizador */
.timerbox{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:4px auto}
.timerbox svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timerbox .tree{position:absolute;inset:14% 14% 26% 14%}
.timerbox .tree svg{width:100%;height:100%}
.timerbox .clock{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:44px}
.modeLabel{text-align:center;font-weight:700;color:var(--muted)}
.speed{font-size:13px;color:var(--muted)}

/* bosque */
.forest{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.forest .cell{aspect-ratio:1;border-radius:12px;background:var(--surface2)}
.forest svg{width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
details.lesson{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px}
details.lesson summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;cursor:pointer;list-style:none}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson[open] summary .ic{transform:rotate(90deg)}
details.lesson .body{padding:0 0 14px;display:flex;flex-direction:column;gap:10px}

/* calendario */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{min-height:60px;border-radius:12px;border:1.5px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.day b{font-size:17px;color:var(--ink);font-family:var(--f-display)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);position:absolute;bottom:6px}
.act{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.act.done{opacity:.6}
.act .t{font-weight:700;font-size:16px;overflow-wrap:anywhere}

/* teléfono de prueba */
.phone{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;border-radius:20px;background:var(--surface2)}
.appicon{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;min-height:44px}
.appicon i{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:22px;font-family:var(--f-display)}

/* navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{min-height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* avisos y capas */
.banners{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.banner{pointer-events:auto;max-width:480px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.toast{pointer-events:auto;max-width:480px;width:100%;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:500}
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ov.center{align-items:center}
.ov.center .sheet{border-radius:24px;max-height:88%;margin:0 12px}
.ov.full{align-items:stretch}
.ov.full .sheet{max-width:none;max-height:none;border-radius:0;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));align-items:center}
.ov.full .inner{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.ov.warm .sheet{background:var(--warm-soft)}
.ov.warm h2{color:var(--ink)}
.ov.shield{background:var(--shield)}
.ov.shield .sheet{background:var(--shield);color:var(--shield-ink)}
.ov.shield .sub{color:color-mix(in srgb,var(--shield-ink) 72%,transparent)}
.ov.shield .btn{background:color-mix(in srgb,var(--shield-ink) 14%,transparent);color:var(--shield-ink)}
.ov.shield .btn.primary{background:var(--accent);color:var(--accent-ink)}
.ov.shield .btn.link{background:none;color:color-mix(in srgb,var(--shield-ink) 72%,transparent)}
.stepdots{display:flex;gap:6px}
.stepdots i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.stepdots i.on{background:var(--accent)}
.empty{text-align:center;padding:20px 8px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:240px;overflow:auto}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

/* pantalla de inicio: el logo está dibujado sobre blanco, por eso este fondo es blanco en ambos temas */
#splash{position:fixed;inset:0;z-index:100;background:#FEFEFE;display:grid;place-items:center;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px;text-align:center}
#splash img{width:min(66vw,320px);height:auto;display:block}
#splash .sp-name{font-family:var(--f-display);font-weight:700;font-size:38px;color:#32345D;letter-spacing:-.01em}
#splash .sp-tag{color:#6B6390;font-size:15px}
#splash .sp-bar{width:120px;height:4px;border-radius:2px;background:#E7DCFA;overflow:hidden;margin-top:14px}
#splash .sp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#C39BF1,#7145CE);transform-origin:left}
@media (prefers-reduced-motion: no-preference){
  #splash img{animation:spin-in .7s ease-out both}
  #splash .sp-name,#splash .sp-tag{animation:fade-up .6s .25s ease-out both}
  #splash .sp-bar i{animation:fill 2.2s linear both}
  @keyframes spin-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
</style>

<div class="app">
  <header class="top" id="top"></header>
  <main id="view" style="display:flex;flex-direction:column;gap:16px"></main>
</div>
<nav class="nav" id="nav" aria-label="Navegación principal"></nav>
<div class="banners" id="banners" aria-live="polite"></div>
<div id="overlay"></div>
<div id="splash" role="img" aria-label="FocoUC"><div class="sp-in"><img id="splash-img" alt="Logo de FocoUC: un reloj relajado dentro de un círculo morado"><div class="sp-name">FocoUC</div><div class="sp-tag">Empieza sin culpa, a tu ritmo.</div><div class="sp-bar"><i></i></div></div></div>

function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function at(date,t){var a=date.split('-').map(Number),b=t.split(':').map(Number);return new Date(a[0],a[1]-1,a[2],b[0],b[1],0,0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function startAt(a){return at(a.date,a.start)}
function limitAt(a){var l=at(a.date,a.limit),s=startAt(a);if(l<=s)l=new Date(l.getTime()+864e5);return l}
var DN=['dom','lun','mar','mié','jue','vie','sáb'], MN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function dayLabel(date){
  var t=new Date();t.setHours(0,0,0,0);var d=at(date,'00:00');var diff=Math.round((d-t)/864e5);
  if(diff===0)return 'Hoy';if(diff===1)return 'Mañana';if(diff===-1)return 'Ayer';
  return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()];
}

  settings:{levels:[true,true,true,true],quiet:{from:'22:00',to:'07:00'},consent:false,blocked:['redes','juegos','videos'],sound:true},
  acts:[],sessions:[],forest:[],reflections:[],reasons:[],blockLog:[],

function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
var S=Object.assign(defaults(),load()||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function newAlert(){return{level:0,dis:0,lastEsc:0,enteredAt:0,pausedUntil:0,pauses:0,soft:false}}

  function mk(title,start,limMin,trig,action,done){

    mk('Estudiar para el parcial de Estadística',dayAt(5,10,0),120,'se me hace muy grande','repaso un solo tema por bloque de 25 minutos'),
    mk('Mapa conceptual de Historia del Perú',dayAt(-1,17,0),60,'me distraigo con el celular','activo el modo concentración y dibujo el centro del mapa',true),
    mk('Práctica de Programación',dayAt(-2,10,0),90,'no sé por dónde empezar','abro el editor y escribo el nombre de la función',true)];
}
function seedAll(){
  var now=Date.now(),items=[];
  /* [días atrás, árboles, brotes] */
  [[0,1,1],[1,3,0],[2,2,1],[3,1,1],[5,2,0],[6,1,1],[8,2,1],[9,1,0]].forEach(function(p){
    var base=at(ymd(new Date(now-p[0]*864e5)),'10:00').getTime();
    for(var i=0;i<p[1]+p[2];i++){items.push({ts:Math.min(now-30*MIN,base+i*70*MIN),tree:i<p[1]})}
  });
  items.sort(function(a,b){return a.ts-b.ts});
  items.forEach(function(it,n){
    S.forest.push({id:uid(),date:ymd(new Date(it.ts)),kind:it.tree?'tree':'sprout',sp:n%3,example:true});
    S.sessions.push({id:uid(),actId:null,type:it.tree?'focus':'five',min:it.tree?25:5,ts:it.ts,done:true,example:true});
  });
  S.acts=seedActs();
}

/* ---------- reglas de alertas ---------- */
function inQuiet(d){
  var f=S.settings.quiet.from,t=S.settings.quiet.to,c=hm(d);
  return f<=t ? (c>=f&&c<t) : (c>=f||c<t);
}
function pendingSorted(){return S.acts.filter(function(a){return a.status==='pending'}).sort(function(a,b){return startAt(a)-startAt(b)})}
function nextAct(){
  var now=Date.now(),p=pendingSorted();
  for(var i=0;i<p.length;i++){if(limitAt(p[i]).getTime()+6*3600e3>now)return p[i]}
  return null;
}
var MSG=[
 'Esto se siente pesado a veces. Con cinco minutos ya habrás avanzado más que con cero.',
 'No necesitas ganas para empezar; las ganas suelen llegar después. ¿Probamos con 5 minutos?',
 'Tu plan decía: «si {t}, entonces {a}». ¿Te sirve usarlo ahora?',
 'Si hoy no se puede, reprogramarlo con cariño también es planificar.'
];
function alertTick(){
  if(!S.onboarded)return;
  var nowD=new Date(),now=nowD.getTime();
  if(inQuiet(nowD))return;
  if(T.running&&T.mode!=='break')return;
  var blocking=ui.overlay&&['l3','shield','reprog','needConsent','onb'].indexOf(ui.overlay.t)>-1;
  S.acts.forEach(function(a){
    if(a.status!=='pending'||a.started)return;
    var al=a.alert;if(now<al.pausedUntil)return;
    var s=startAt(a).getTime(),l=limitAt(a).getTime();
    if(now<s-15*MIN||now>l+6*3600e3)return;
    var target=now<s?1:(now<l?2:3);
    if(al.level<3&&target>al.level){
      var gapOk=al.level===0||now-al.lastEsc>=10*MIN;
      if(gapOk&&!blocking){
        var n=al.level+1;while(n<=target&&!S.settings.levels[n-1])n++;
        if(n<=target)enter(a,n);else{al.level=target;al.lastEsc=now;save()}
      }
    } else if(al.level===3&&!blocking){
      if(al.dis>=2||now-al.enteredAt>=15*MIN&&al.dis>=1||now-al.enteredAt>=25*MIN){
        if(S.settings.levels[3]&&S.settings.consent&&!S.block.active&&now>=S.block.pausedUntil)enter(a,4);
        else if(!al.soft){al.soft=true;toast('Sigo aquí cuando quieras empezar. Sin presión.');save()}
      } else if(now-al.lastEsc>=10*MIN&&!ui.overlay){enter(a,3)}
    }
  });
}
function enter(a,level){
  var al=a.alert,now=Date.now();al.level=level;al.enteredAt=now;al.lastEsc=now;
  if(level===1){ui.overlay={t:'l1',id:a.id}}
  if(level===2){if(!ui.banners.some(function(b){return b.id===a.id}))ui.banners.push({id:a.id});}
  if(level===3){ui.banners=ui.banners.filter(function(b){return b.id!==a.id});ui.overlay={t:'l3',id:a.id,m:ui.msgN++};chime();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  if(level===4){S.block.active=true;S.blockLog.unshift({ts:now,ev:'Se activó el bloqueo parcial'});ui.overlay=null;toast('Bloqueo parcial activo. Se libera con 5 minutos de enfoque.')}
  save();renderAll();
}
function release(why){
  if(!S.block.active)return;
  S.block.active=false;S.blockLog.unshift({ts:Date.now(),ev:why});
  S.acts.forEach(function(a){if(a.alert.level>=3){a.alert.level=0;a.alert.dis=0}});
  save();
}
var ac;
function chime(){
  if(!S.settings.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t0=ac.currentTime;
    [[523.25,0],[659.25,.4],[783.99,.8],[523.25,1.8],[659.25,2.2],[783.99,2.6]].forEach(function(n){
      var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0,t0+n[1]);g.gain.linearRampToValueAtTime(.18,t0+n[1]+.05);g.gain.exponentialRampToValueAtTime(.001,t0+n[1]+.7);
      o.connect(g);g.connect(ac.destination);o.start(t0+n[1]);o.stop(t0+n[1]+.8)});
  }catch(e){}
}
function toast(m){ui.toast=m;renderBanners();clearTimeout(toast.t);toast.t=setTimeout(function(){ui.toast=null;renderBanners()},4200)}

/* ---------- temporizador ---------- */
function startTimer(mode,actId,opts){
  opts=opts||{};
  var tot=(mode==='focus'?25:5)*MIN;
  T={mode:mode,total:tot,rem:opts.rem||tot,running:true,last:Date.now(),actId:actId||null,cont:!!opts.cont,t0:Date.now()};
  var a=S.acts.find(function(x){return x.id===actId});
  if(a&&mode!=='break'){a.started=true;a.alert.level=0;a.alert.dis=0}
  ui.banners=ui.banners.filter(function(b){return b.id!==actId});
  if(ui.overlay&&['l1','l3','shield','five','done'].indexOf(ui.overlay.t)>-1)ui.overlay=null;
  ui.tab='foco';save();renderAll();window.scrollTo(0,0);
}
function finishTimer(){
  var m=T.mode,id=T.actId;T.running=false;
  if(m==='focus'||m==='five'){
    var mins=T.cont?20:(m==='focus'?25:5);
    S.sessions.push({id:uid(),actId:id,type:m,min:mins,ts:Date.now(),done:true});
    if(T.cont&&ui.lastSprout){S.forest=S.forest.filter(function(f){return f.id!==ui.lastSprout});ui.lastSprout=null}
    var f={id:uid(),date:ymd(new Date()),kind:m==='focus'?'tree':'sprout',sp:S.forest.length%3};
    S.forest.push(f);
    release(m==='focus'?'Se liberó tras completar un Pomodoro':'Se liberó tras 5 minutos de enfoque');
    if(m==='five'){ui.lastSprout=f.id;ui.overlay={t:'five',id:id}}
    else ui.overlay={t:'done',id:id};
    chime();
  } else {T.mode=null;toast('Descanso terminado. Cuando quieras, seguimos.')}
  save();renderAll();
}
function timerTick(){
  var now=Date.now();
  if(T.mode&&T.running){
    T.rem-=(now-T.last)*(ui.fast?60:1);T.last=now;
    if(T.rem<=0){T.rem=0;finishTimer();return}
    updateTimerUI();
  } else T.last=now;
}
function fmt(ms){var s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)}
function tp(){if(!T.mode)return 0;if(T.mode==='break')return 1;var base=T.cont?5*MIN:0;return Math.min(1,(base+T.total-T.rem)/(25*MIN)*(T.cont?1:1))}
function updateTimerUI(){
  var el=document.getElementById('t-time');if(!el)return;
  el.textContent=fmt(T.rem);
  var r=document.getElementById('t-ring');
  if(r){var C=2*Math.PI*46;var frac=T.total?(T.total-T.rem)/T.total:0;r.setAttribute('stroke-dashoffset',String(C*(1-frac)))}
  var tr=document.getElementById('t-tree');if(tr)tr.innerHTML=treeSVG(tp(),(S.forest.length)%3);
}

/* ---------- árbol ---------- */
function treeSVG(p,sp){
  p=Math.max(0,Math.min(1,p));var base=92,col='var(--leaf'+(sp%3)+')';
  var g='<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="93" rx="'+(14+p*14)+'" ry="4" fill="var(--soil)"/>';
  if(p<.06)return g+'<circle cx="50" cy="90" r="3.2" fill="var(--trunk)"/></svg>';
  var th=6+p*34,r=4+p*25,cy=base-th;
  g+='<rect x="'+(50-1.2-p*1.6)+'" y="'+cy+'" width="'+(2.4+p*3.2)+'" height="'+th+'" rx="1.6" fill="var(--trunk)"/>';
  if(p<.2){g+='<ellipse cx="'+(50-r*.7)+'" cy="'+(cy+1)+'" rx="'+(r*.8)+'" ry="'+(r*.45)+'" fill="'+col+'" transform="rotate(-25 '+(50-r*.7)+' '+(cy+1)+')"/><ellipse cx="'+(50+r*.7)+'" cy="'+(cy-1)+'" rx="'+(r*.8)+'" ry="'+(r*.45)+'" fill="'+col+'" transform="rotate(25 '+(50+r*.7)+' '+(cy-1)+')"/>'}
  else{g+='<circle cx="'+(50-r*.65)+'" cy="'+(cy+r*.15)+'" r="'+(r*.72)+'" fill="'+col+'" opacity=".85"/><circle cx="'+(50+r*.65)+'" cy="'+(cy+r*.15)+'" r="'+(r*.72)+'" fill="'+col+'" opacity=".85"/><circle cx="50" cy="'+(cy-r*.3)+'" r="'+r+'" fill="'+col+'"/>'}
  return g+'</svg>';
}
function miniTree(f){return treeSVG(f.kind==='tree'?1:.2,f.sp)}

  case 'nav':ui.tab=v;ui.overlay=null;renderAll();window.scrollTo(0,0);break;
  case 'closeOv':ui.overlay=null;renderOverlay();break;
  case 'openForm':ui.overlay={t:'form',id:id||''};renderOverlay();break;
  case 'saveForm':{
    var title=document.getElementById('f-title').value.trim();
    if(!title){document.getElementById('f-err').textContent='Escribe qué quieres avanzar.';break}
    var o={title:title,date:document.getElementById('f-date').value,start:document.getElementById('f-start').value,limit:document.getElementById('f-limit').value,trigger:document.getElementById('f-trig').value.trim(),action:document.getElementById('f-act').value.trim()};
    if(!o.date||!o.start||!o.limit){document.getElementById('f-err').textContent='Completa día y horas.';break}
    if(a){Object.assign(a,o,{started:false,alert:newAlert(),example:false});if(a.status==='done')a.status='pending'}
    else{S.acts.push(Object.assign({id:uid(),status:'pending',started:false,alert:newAlert()},o));}
    ui.day=o.date;save();ui.overlay=null;toast('Actividad guardada. Te aviso con calma cuando se acerque.');renderAll();break}
  case 'chipTrig':{var c=ui.chips[+v];document.getElementById('f-trig').value=c[0];document.getElementById('f-act').value=c[1];break}
  case 'deleteAct':S.acts=S.acts.filter(function(x){return x.id!==id});ui.banners=ui.banners.filter(function(b){return b.id!==id});save();ui.overlay=null;renderAll();break;
  case 'doneAct':case 'doneYes':if(a){a.status='done';a.alert.level=0;ui.banners=ui.banners.filter(function(b){return b.id!==id});if(S.block.active)release('Se liberó al marcar la actividad como lista');save();ui.overlay=null;toast('Actividad lista. Buen trabajo.');renderAll()}break;
  case 'start5':startTimer('five',id);break;
  case 'startFocus':startTimer('focus',id);break;
  case 'startBreak':startTimer('break',null);break;
  case 'pauseT':T.running=false;renderView();break;
  case 'resumeT':T.running=true;T.last=Date.now();renderView();break;
  case 'stopT':T.mode=null;T.running=false;renderAll();toast('Está bien. Lo intentamos de nuevo cuando quieras.');break;
  case 'five20':{ui.overlay=null;startTimer('focus',id,{rem:20*MIN,cont:true});break}
  case 'fiveClose':ui.overlay=null;T.mode=null;toast('Cinco minutos ya son un buen comienzo.');renderAll();break;
  case 'bannerLater':ui.banners=ui.banners.filter(function(b){return b.id!==id});renderBanners();break;
  case 'sim':simulate(+v);break;
  case 'resetSim':S.block.active=false;S.block.pausedUntil=0;S.acts.forEach(function(x){x.alert=newAlert();x.started=false});ui.banners=[];ui.overlay=null;save();renderAll();toast('Alertas restablecidas.');break;
  case 'appOpen':{
    var apps={redes:'Redes',juegos:'Juegos',videos:'Videos',clase:'Campus UC',tel:'Teléfono',msg:'Mensajes'};
    if(v==='clase'||v==='tel'||v==='msg')toast(apps[v]+' se abre con normalidad. Nunca se bloquea.');
    else if(S.block.active&&S.settings.blocked.indexOf(v)>-1&&now>=S.block.pausedUntil){var cur=S.acts.find(function(x){return x.alert.level>=3})||nextAct();ui.overlay={t:'shield',app:v,id:cur?cur.id:''};renderOverlay()}
    else toast(apps[v]+' se abre con normalidad (el bloqueo no está activo).');
    break}
  case 'l3start':startTimer('five',id);break;
  case 'l3reprog':ui.overlay={t:'reprog',id:id};renderOverlay();break;
  case 'l3pause':
    if(a){if(a.alert.pauses>=2){toast('Ya usaste dos pausas. ¿Reprogramamos mejor?');ui.overlay={t:'reprog',id:id};renderOverlay();break}
      a.alert.pauses++;a.alert.pausedUntil=now+20*MIN;a.alert.level=2;a.alert.lastEsc=now;ui.overlay=null;save();renderAll();toast('Descansa tranquilo/a. Te vuelvo a escribir en 20 minutos, sin presión.')}break;
  case 'l3later':if(a){a.alert.dis++;a.alert.lastEsc=now}ui.overlay=null;save();renderAll();break;
  case 'reason':ui.overlay.reason=v;S.reasons.push({ts:now,r:v});save();renderOverlay();break;
  case 'resched':if(a){var r=ui.overlay&&ui.overlay.reason,st;
      if(v==='tom'){var t=new Date(now+864e5);st=at(ymd(t),a.start)}else st=new Date(now+(+v)*MIN);
      reschedule(a,st);ui.banners=ui.banners.filter(function(b){return b.id!==id});save();ui.overlay=null;
      if(r==='grande'){ui.overlay={t:'form',id:id}}
      renderAll();toast('Gracias por avisar. Nueva hora: '+dayLabel(a.date).toLowerCase()+' '+a.start+(r==='grande'?'. Divide la tarea: escribe solo el primer paso pequeño.':'.'))}break;
  case 'shieldStart5':startTimer('five',ui.overlay.id);break;
  case 'shieldFocus':startTimer('focus',ui.overlay.id);break;
  case 'shieldPause':S.block.pausedUntil=now+30*MIN;S.blockLog.unshift({ts:now,ev:'Pausa de 30 minutos'});save();ui.overlay=null;renderAll();toast('Bloqueo en pausa 30 minutos.');break;
  case 'shieldEmergency':S.block.pausedUntil=now+3*3600e3;release('Salida de emergencia');ui.overlay=null;renderAll();toast('Listo. El bloqueo se desactivó. No vuelve a activarse en 3 horas.');break;
  case 'openSettings':ui.overlay={t:'settings'};renderOverlay();break;
  case 'settingsBack':ui.overlay={t:'settings'};renderOverlay();break;
  case 'pauseBlock24':S.block.pausedUntil=now+864e5;S.blockLog.unshift({ts:now,ev:'Pausa de 24 horas'});save();toast('Bloqueo en pausa 24 horas.');renderOverlay();break;
  case 'exportData':ui.overlay={t:'export'};renderOverlay();break;
  case 'copyExp':{var tx=JSON.stringify(S,null,1);try{navigator.clipboard.writeText(tx).then(function(){toast('Copiado.')}).catch(function(){selExp()})}catch(e){selExp()}break}
  case 'clearExamples':S.acts=S.acts.filter(function(x){return !x.example});S.forest=S.forest.filter(function(x){return !x.example});S.sessions=S.sessions.filter(function(x){return !x.example});ui.banners=[];save();renderAll();ui.overlay={t:'settings'};renderOverlay();toast('Listo. Quité los datos de ejemplo.');break;
  case 'wipe':ui.wipe=true;renderOverlay();break;
  case 'wipeNo':ui.wipe=false;renderOverlay();break;
  case 'wipe2':try{localStorage.removeItem(KEY)}catch(e){}S=defaults();T={mode:null,total:0,rem:0,running:false,last:0,actId:null,cont:false};ui.wipe=false;ui.noSeed=true;ui.banners=[];ui.tab='hoy';ui.onb=0;ui.overlay={t:'onb'};renderAll();break;
  case 'weekPrev':ui.week--;renderView();break;
  case 'weekNext':ui.week++;renderView();break;
  case 'selDay':ui.day=v;renderView();break;
  case 'thought':ui.thought=v;renderView();break;
  case 'saveRefl':{var alt=document.getElementById('r-alt').value.trim();if(!alt)break;S.reflections.unshift({id:uid(),ts:now,thought:ui.thought,alt:alt});ui.thought=null;save();renderView();toast('Reflexión guardada.');break}
  case 'onbNext':ui.onb++;renderOverlay();break;
  case 'onbBack':ui.onb--;renderOverlay();break;
  case 'onbFinish':S.onboarded=true;if(!S.seeded&&!ui.noSeed&&!S.acts.length)seedAll();S.seeded=true;ui.overlay=null;save();renderAll();toast('Todo listo. Empieza por lo más pequeño.');break;
  }
}
function selExp(){var p=document.getElementById('exp');if(p){var r=document.createRange();r.selectNodeContents(p);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}toast('Selecciona y copia el texto.')}
function simulate(n){
  ui.labOpen=true;
  var a=S.acts.find(function(x){return x.status==='pending'&&!x.started})||pendingSorted()[0];
  if(!a){toast('Primero crea una actividad en Plan.');return}
  a.started=false;
  if(n===4){
    if(!S.settings.consent||!S.settings.levels[3]){ui.overlay={t:'needConsent'};renderOverlay();return}
    a.alert.level=3;S.block.pausedUntil=0;enter(a,4);return}
  if(n===3){a.alert.dis=0}
  enter(a,n);
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  if(e.target.closest('details#lab'))ui.labOpen=true;
  act(b.dataset.a,b.dataset);
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='lab')ui.labOpen=e.target.open},true);
document.addEventListener('change',function(e){
  var t=e.target,c=t.dataset&&t.dataset.c;if(!c)return;var s=S.settings;
  if(c==='selAct'){ui.selAct=t.value;return}
  if(c==='fast'){ui.fast=t.checked;return}
  if(c==='lv'){s.levels[+t.dataset.v]=t.checked}
  if(c==='lv123'){s.levels[0]=s.levels[1]=s.levels[2]=t.checked}
  if(c==='qf'&&t.value)s.quiet.from=t.value;
  if(c==='qt'&&t.value)s.quiet.to=t.value;
  if(c==='snd')s.sound=t.checked;
  if(c==='cns'){s.consent=t.checked;s.levels[3]=t.checked?true:s.levels[3]}
  if(c==='app'){var k=t.dataset.v,i=s.blocked.indexOf(k);if(t.checked&&i<0)s.blocked.push(k);if(!t.checked&&i>-1)s.blocked.splice(i,1)}
  save();
  if(ui.overlay&&ui.overlay.t==='settings')renderOverlay();
  if(ui.overlay&&ui.overlay.t==='onb')renderOverlay();
});

/* ---------- arranque ---------- */
if(!S.onboarded)ui.overlay={t:'onb'};
renderAll();
(function(){
  var sp=document.getElementById('splash'),im=document.getElementById('splash-img');
  if(!sp)return;im.src=LOGO;
  var gone=false;function hide(){if(gone)return;gone=true;sp.classList.add('out');setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},500)}
  sp.addEventListener('click',hide);setTimeout(hide,2400);
})();
setInterval(timerTick,250);
setInterval(function(){alertTick()},5000);
setTimeout(alertTick,1500);
})();
</script>
